# Verify each supported PHP/database combination rather than treating SQLite
# acceptance as proof of server locking, collation, or date-storage behavior.
name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      # Finish every lane even when one fails, keeping driver-specific failures visible.
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        database: ['sqlite', 'mysql', 'pgsql']
    services:
      # Database and Redis services are disposable CI fixtures. Environment.php
      # checks the dedicated test database identity before resetting its schema.
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: scarlett_collision_tests
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ptesting"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testing
          POSTGRES_DB: scarlett_collision_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d scarlett_collision_tests"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      # Feature tests and independent collision workers read the same driver selection.
      SCARLETT_TEST_DRIVER: ${{ matrix.database }}
      SCARLETT_TEST_USER: ${{ matrix.database == 'pgsql' && 'postgres' || 'root' }}
      SCARLETT_TEST_PASSWORD: testing
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite, redis
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      # CI verifies the actual suite rather than relying on a developer's coverage cache.
      - run: vendor/bin/pest --no-tia
      - run: vendor/bin/pint --test
